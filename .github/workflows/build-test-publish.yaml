name: Test and Publish

on:
 pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  checks: write
  pull-requests: write
  contents: write

jobs:
  test:
    runs-on: windows-latest
    outputs:
      skip-publish: ${{ steps.check-tag.outputs.exists }}
    continue-on-error: true
    steps:
    - uses: actions/checkout@v6
      with:
        sparse-checkout: |
          .github
          src

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore src/ParquetViewer.sln

    - name: Build
      run: dotnet build src/ParquetViewer.sln --configuration Debug --no-restore

    - name: Test
      run: dotnet test src/ParquetViewer.sln --no-build --logger trx

    - name: Test Report
      uses: bibipkins/dotnet-test-reporter@v1.6.1
      if: github.repository == 'ChthollyFan/ParquetViewer'
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        comment-title: 'Unit Test Results'
        results-path: ./src/ParquetViewer.Tests/TestResults/*.trx

  checkPublish:
    runs-on: windows-latest
    needs: test
    if: github.repository == 'ChthollyFan/ParquetViewer' && github.event.pull_request.draft == false
    outputs:
      release_version: ${{ steps.release-version.outputs.release_version }}
      should_publish: ${{ steps.should-publish.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src/ParquetViewer/Properties/AssemblyInfo.cs

      - name: Get Release version
        id: release-version
        run: |
          $content = Get-Content -Path "src/ParquetViewer/Properties/AssemblyInfo.cs" -Raw
          # 只取主.次.修订三段：与程序内 SemanticVersion 的显示规则（Build 为 0 时显示三段）保持一致
          $pattern = '\[assembly: AssemblyVersion\("(\d+\.\d+\.\d+)'
          $match = Select-String -InputObject $content -Pattern $pattern
          $versionMatch = $match.Matches[0].Groups[1].Value
          "release_version=$versionMatch" >> $env:GITHUB_OUTPUT
          Write-Host "Checking version $versionMatch"

      - name: Is there a finalized release already
        uses: mukunku/release-exists-action@v1.1.0
        id: check-release
        with: 
          tag: 'v${{ steps.release-version.outputs.release_version }}'

      - id: should-publish
        run: | 
          "should_publish=" + ('${{ steps.check-release.outputs.exists }}' -eq 'false').ToString() >> $env:GITHUB_OUTPUT

  publish:
    runs-on: windows-latest
    needs: checkPublish
    if: needs.checkPublish.outputs.should_publish == 'true'
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.number }}
      VERSION_NUMBER: ${{ needs.checkPublish.outputs.release_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            src

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build & Publish Regular Release
        run: |
            dotnet publish src/ParquetViewer/ParquetViewer.csproj -c Release  -f net10.0-windows --nologo -o publish -r win-x64 --no-self-contained
            Get-Item "./publish/ParquetViewer.exe" | Select-Object Name, Length
            
      - name: Build & Publish SelfContained Release
        run: |
            dotnet publish src/ParquetViewer/ParquetViewer.csproj -c Release_SelfContained  -f net10.0-windows --nologo -o publish_selfcontained -r win-x64 --self-contained
            Get-Item "./publish_selfcontained/ParquetViewer.exe" | Select-Object Name, Length

      - name: Prepare executables for upload
        run: |
          Move-Item -Path "publish/ParquetViewer.exe" -Destination "./ParquetViewer.exe"
          Move-Item -Path "publish_selfcontained/ParquetViewer.exe" -Destination "./ParquetViewer_SelfContained.exe"

      # 上游的 SignPath 代码签名配置属于 mukunku 账号，本仓库无法复用其令牌与配置，
      # 因此跳过签名环节，直接上传构建产物创建 Release（exe 为未签名状态）
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "ParquetViewer.exe,ParquetViewer_SelfContained.exe"
          body: "PR: #${{ env.PR_NUMBER }}"
          allowUpdates: ${{ env.BRANCH_NAME != 'main' }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          prerelease: true
          replacesArtifacts: true
          updateOnlyUnreleased: true
          tag: v${{ env.VERSION_NUMBER }}
          commit: ${{ github.sha }}